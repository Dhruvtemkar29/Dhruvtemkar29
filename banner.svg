<svg width="1000" height="320" viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05010f"/>
      <stop offset="50%" stop-color="#14052e"/>
      <stop offset="100%" stop-color="#021a24"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#FF2E97"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7B2FFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7B2FFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00F5FF" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="clip"><rect width="1000" height="320" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1000" height="320" fill="url(#bg)"/>
    <rect width="1000" height="320" fill="url(#grid)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 40" dur="3s" repeatCount="indefinite"/>
    </rect>

    <!-- pulsing glow orbs -->
    <circle cx="180" cy="90" r="170" fill="url(#glow)">
      <animate attributeName="r" values="150;200;150" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="840" cy="250" r="190" fill="url(#glow)">
      <animate attributeName="r" values="200;150;200" dur="7s" repeatCount="indefinite"/>
    </circle>

    <!-- floating particles -->
    <g fill="#00F5FF">
      <circle cx="80"  cy="300" r="2"><animate attributeName="cy" values="320;-10" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="220" cy="300" r="3"><animate attributeName="cy" values="320;-10" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="380" cy="300" r="2"><animate attributeName="cy" values="320;-10" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="300" r="3"><animate attributeName="cy" values="320;-10" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8s" repeatCount="indefinite"/></circle>
      <circle cx="720" cy="300" r="2"><animate attributeName="cy" values="320;-10" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="10s" repeatCount="indefinite"/></circle>
      <circle cx="900" cy="300" r="3"><animate attributeName="cy" values="320;-10" dur="7.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7.5s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="#FF2E97">
      <circle cx="150" cy="300" r="2"><animate attributeName="cy" values="320;-10" dur="8.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8.5s" repeatCount="indefinite"/></circle>
      <circle cx="470" cy="300" r="2"><animate attributeName="cy" values="320;-10" dur="6.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6.5s" repeatCount="indefinite"/></circle>
      <circle cx="650" cy="300" r="3"><animate attributeName="cy" values="320;-10" dur="9.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9.5s" repeatCount="indefinite"/></circle>
      <circle cx="950" cy="300" r="2"><animate attributeName="cy" values="320;-10" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/></circle>
    </g>

    <!-- top tag -->
    <text x="500" y="70" text-anchor="middle" font-family="'Courier New',monospace" font-size="16" fill="#00F5FF" letter-spacing="6">
      &lt; HELLO, WORLD /&gt;
      <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
    </text>

    <!-- glitch name: cyan + magenta ghosts behind main -->
    <text x="500" y="176" text-anchor="middle" font-family="Impact,'Arial Black',sans-serif" font-size="92" fill="#00F5FF" opacity="0.7" letter-spacing="6">
      DHRUV TEMKAR
      <animateTransform attributeName="transform" type="translate" values="0 0;-4 0;3 0;0 0;0 0;0 0;0 0" dur="3s" repeatCount="indefinite"/>
    </text>
    <text x="500" y="176" text-anchor="middle" font-family="Impact,'Arial Black',sans-serif" font-size="92" fill="#FF2E97" opacity="0.7" letter-spacing="6">
      DHRUV TEMKAR
      <animateTransform attributeName="transform" type="translate" values="0 0;4 0;-3 0;0 0;0 0;0 0;0 0" dur="3s" repeatCount="indefinite"/>
    </text>
    <text x="500" y="176" text-anchor="middle" font-family="Impact,'Arial Black',sans-serif" font-size="92" fill="url(#name)" letter-spacing="6">
      DHRUV TEMKAR
    </text>

    <!-- subtitle -->
    <text x="500" y="226" text-anchor="middle" font-family="'Courier New',monospace" font-size="20" fill="#e6edf3" letter-spacing="3">
      FULL-STACK  •  AI  •  DATA  •  HACKATHONS
    </text>

    <!-- scanning line -->
    <rect x="0" y="0" width="1000" height="3" fill="#00F5FF" opacity="0.5">
      <animate attributeName="y" values="-5;325" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="0" width="1000" height="40" fill="#00F5FF" opacity="0.05">
      <animate attributeName="y" values="-40;320" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- bottom rail -->
    <rect x="300" y="262" width="400" height="2" fill="#7B2FFF" opacity="0.5"/>
    <rect x="300" y="262" width="80" height="2" fill="#00F5FF">
      <animate attributeName="x" values="300;620;300" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="500" y="292" text-anchor="middle" font-family="'Courier New',monospace" font-size="13" fill="#8b949e" letter-spacing="4">MUMBAI ⇄ BANGALORE</text>
  </g>

  <rect x="1" y="1" width="998" height="318" rx="18" fill="none" stroke="#7B2FFF" stroke-opacity="0.6" stroke-width="2"/>
</svg>
